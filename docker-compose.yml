services:
  mysql:
    image: mysql:8.4
    container_name: community-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root1234
      MYSQL_DATABASE: community
      MYSQL_USER: community
      MYSQL_PASSWORD: community1234
    ports:
      - "3306:3306"
    volumes:
      - community-mysql-data:/var/lib/mysql

volumes:
  community-mysql-data:
    name: community-mysql-data